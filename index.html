<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изображение на весь экран</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; /* Белый фон под цвет вашей картинки */
        }
        img {
            width: 100vw;
            height: 100vh;
            /* contain — картинка впишется целиком без обрезки краев.
               Если нужно заполнить абсолютно весь экран с обрезкой краев, замените на cover */
            object-fit: contain; 
            display: block;
        }
    </style>
</head>
<body>

    <img src="image.png" alt="Баннер">

</body>
</html>
