    <div id="toast" class="toast">IP скопирован в буфер обмена</div>
    <script>
        function copyIP(ip) {
            navigator.clipboard.writeText(ip).then(() => {
                const t = document.getElementById('toast');
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2200);
            });
        }
